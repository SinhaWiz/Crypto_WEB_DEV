services:
  - type: web
    name: crypto-sim-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: coingecko
      - key: MARKET_DATA_API_KEY
        sync: false
      - key: PRICE_TICK_INTERVAL_MS
        value: 3000
      - key: HISTORICAL_REFRESH_CRON
        value: 0 */6 * * *
